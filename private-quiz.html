<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#138fae">
  <title>اختبار إلكتروني | منصة التعليم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:light;--moe-blue:#168fb5;--moe-blue-dark:#08779c;--moe-teal:#16a69c;--moe-green:#2db47d;--navy:#0d2b45;--ink:#17354d;--muted:#70869a;--line:#d9e8ef;--soft:#edf7fb;--page:#f2f9fc;--card:#fff;--danger:#dc5b6b;--shadow:0 22px 60px rgba(20,91,119,.12);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;font-synthesis:none}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--page)}body{min-height:100vh;color:var(--ink);background:radial-gradient(circle at 14% 18%,rgba(22,143,181,.08),transparent 25%),linear-gradient(180deg,#eaf6fb 0,#f7fbfd 420px,#f2f9fc 100%)}button,input,select,textarea{font:inherit}.hidden{display:none!important}
    .hero{position:relative;isolation:isolate;overflow:hidden;min-height:330px;padding:24px clamp(18px,4vw,64px) 82px;color:#fff;background:linear-gradient(118deg,#168fb5 0%,#159fb0 48%,#2db47d 105%)}.hero:before{content:"";position:absolute;inset:0;z-index:-1;opacity:.22;background-image:radial-gradient(circle,#fff 0 3px,transparent 3.4px),radial-gradient(circle,#fff 0 2px,transparent 2.4px);background-size:34px 34px,34px 34px;background-position:calc(100% - 44px) 52px,calc(100% - 27px) 69px;mask-image:linear-gradient(90deg,transparent 30%,#000 100%)}.hero:after{content:"";position:absolute;z-index:-1;width:620px;height:620px;left:-230px;bottom:-500px;border:38px solid rgba(255,255,255,.08);border-radius:50%;box-shadow:0 0 0 52px rgba(255,255,255,.045),0 0 0 104px rgba(255,255,255,.03)}
    .hero-top{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:1240px;margin:auto}.ministry-brand{display:flex;align-items:center;gap:13px}.logo-shell{width:88px;height:62px;padding:7px 9px;border-radius:14px;background:#fff;display:grid;place-items:center;box-shadow:0 10px 25px rgba(5,75,93,.2)}.logo-shell img{display:block;width:100%;height:100%;object-fit:contain}.ministry-copy b,.ministry-copy small{display:block}.ministry-copy b{font-size:14px}.ministry-copy small{margin-top:3px;font-size:10px;color:rgba(255,255,255,.78)}.theme-btn{width:46px;height:46px;border:1px solid rgba(255,255,255,.45);border-radius:15px;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(10px)}.theme-btn:hover{background:rgba(255,255,255,.22)}.theme-btn svg{width:21px;height:21px}
    .hero-copy{max-width:900px;margin:45px auto 0;text-align:center}.hero-badge{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid rgba(255,255,255,.35);border-radius:999px;background:rgba(255,255,255,.12);font-size:11px;font-weight:600}.hero-copy h1{margin:14px 0 8px;font-size:clamp(28px,4.5vw,50px);line-height:1.35;letter-spacing:-.02em}.hero-copy p{max-width:700px;margin:auto;color:rgba(255,255,255,.83);font-size:14px;line-height:1.9}.hero-wave{position:absolute;right:-3%;bottom:-1px;width:106%;height:50px;background:var(--page);clip-path:ellipse(62% 45% at 50% 100%)}
    .quiz-shell{position:relative;width:min(900px,calc(100% - 28px));margin:-61px auto 0;padding-bottom:30px;z-index:2}.exam-info{display:grid;grid-template-columns:repeat(3,1fr);align-items:center;gap:0;padding:18px 20px;border:1px solid rgba(22,143,181,.12);border-radius:22px;background:rgba(255,255,255,.96);box-shadow:var(--shadow);backdrop-filter:blur(16px)}.info-item{display:flex;align-items:center;justify-content:center;gap:11px;min-height:54px;padding:4px 18px;border-left:1px solid var(--line)}.info-item:last-of-type{border-left:0}.info-icon{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;border-radius:13px;background:var(--soft);color:var(--moe-blue)}.info-icon svg{width:20px;height:20px}.info-item small,.info-item b{display:block}.info-item small{color:var(--muted);font-size:9px;margin-bottom:3px}.info-item b{font-size:13px;color:var(--navy)}.timer{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:9px;margin-top:12px;padding:10px;border-radius:12px;background:var(--soft);color:var(--moe-blue-dark)}.timer b{font:700 17px ui-monospace,monospace;direction:ltr}.timer.urgent{color:var(--danger)}
    .content{margin-top:22px}.panel{position:relative;padding:clamp(22px,4vw,40px);border:1px solid var(--line);border-top:5px solid var(--moe-blue);border-radius:24px;background:var(--card);box-shadow:var(--shadow)}.steps{display:flex;align-items:center;justify-content:center;margin:0 auto 32px;max-width:620px}.step{display:flex;align-items:center;gap:8px;color:#9aabb8;font-size:11px;white-space:nowrap}.step i{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:#edf1f4;color:#8ca0b0;font-style:normal;font-weight:700}.step.active{color:var(--moe-blue-dark);font-weight:700}.step.active i{color:#fff;background:linear-gradient(135deg,var(--moe-blue),var(--moe-teal));box-shadow:0 7px 18px rgba(22,143,181,.22)}.step.done{color:var(--moe-green)}.step.done i{color:#fff;background:var(--moe-green)}.step-line{height:1px;flex:1;max-width:58px;margin:0 12px;background:#d8e3e9}.gate-heading{text-align:center;margin-bottom:27px}.eyebrow{font-size:11px;color:var(--moe-blue);font-weight:700}.gate-heading h2,.panel h1{color:var(--navy)}.gate-heading h2{margin:9px 0 5px;font-size:clamp(24px,4vw,32px)}.desc{color:var(--muted);font-size:13px;line-height:1.9}.exam-summary{display:flex;align-items:center;gap:10px;margin:0 0 18px;padding:12px 14px;border-radius:13px;background:linear-gradient(90deg,rgba(22,143,181,.08),rgba(45,180,125,.08));color:var(--moe-blue-dark);font-size:11px;line-height:1.7}.exam-summary svg{width:19px;height:19px;flex:0 0 19px}.field{display:grid;gap:8px;margin:16px 0}.field label{font-size:12px;font-weight:600;color:var(--navy)}.field input,.field textarea,.field select,.answer-text{width:100%;min-height:50px;border:1px solid #cbdde6;border-radius:13px;padding:13px 15px;background:#fbfdfe;color:var(--ink);font:inherit;outline:none;transition:.18s}.field input:focus,.field textarea:focus,.field select:focus,.answer-text:focus{border-color:var(--moe-blue);box-shadow:0 0 0 4px rgba(22,143,181,.11);background:#fff}.participant-check{display:flex;align-items:flex-start;gap:10px;padding:13px 14px;margin:13px 0;border:1px solid var(--line);border-radius:13px;background:#f7fbfc;color:var(--ink);font-size:12px}.participant-check input{width:18px;height:18px;flex:0 0 18px;accent-color:var(--moe-teal)}
    .btn{min-height:48px;border:0;border-radius:13px;padding:12px 18px;background:linear-gradient(135deg,var(--moe-blue),var(--moe-teal));color:#fff;font:inherit;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 9px 22px rgba(22,143,181,.2);transition:transform .15s,box-shadow .15s}.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 12px 28px rgba(22,143,181,.27)}.btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}.full{width:100%}.error{min-height:23px;margin-top:8px;color:var(--danger);font-size:11px;text-align:center}
    .progress-card{margin-bottom:14px;padding:14px 17px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.92);box-shadow:0 7px 25px rgba(20,91,119,.06)}.progress-wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:10px}.progress{height:7px;border-radius:99px;background:#e3eef3;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--moe-blue),var(--moe-teal),var(--moe-green));transition:width .25s}.qnum{display:inline-flex;padding:6px 10px;border-radius:999px;background:var(--soft);color:var(--moe-blue-dark);font-size:10px;font-weight:700}.question{font-size:clamp(19px,3.5vw,26px);line-height:1.75;margin:14px 0 22px}.answers{display:grid;gap:11px}.answer{display:flex;align-items:center;gap:12px;text-align:right;width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);cursor:pointer;font:inherit;transition:.16s}.answer:hover{border-color:#8bc8d8;background:#f7fcfd;transform:translateX(-2px)}.answer.selected{border-color:var(--moe-teal);background:linear-gradient(90deg,rgba(22,166,156,.1),rgba(45,180,125,.08));color:var(--navy);box-shadow:0 0 0 3px rgba(22,166,156,.08)}.letter{width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;border-radius:11px;background:var(--soft);color:var(--moe-blue);font-size:11px;font-weight:700}.answer.selected .letter{background:linear-gradient(135deg,var(--moe-teal),var(--moe-green));color:#fff}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:24px}.success{text-align:center}.success-mark{width:72px;height:72px;margin:0 auto 13px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,var(--moe-teal),var(--moe-green));color:#fff;box-shadow:0 14px 30px rgba(45,180,125,.25)}.success-mark svg{width:34px;height:34px}.score{font-size:58px;font-weight:700;color:var(--moe-blue);margin:7px 0}.foot{text-align:center;color:#8ba0af;font-size:10px;padding:21px 0}.foot b{color:var(--moe-blue-dark)}
    html[data-theme="dark"]{color-scheme:dark;--ink:#e5f1f5;--navy:#f4fbfd;--muted:#91a9b6;--line:#274452;--soft:#163b47;--page:#0b2029;--card:#102a35;--shadow:0 22px 60px rgba(0,0,0,.3)}html[data-theme="dark"] body{background:radial-gradient(circle at 15% 18%,rgba(22,143,181,.16),transparent 28%),linear-gradient(180deg,#0a2935,#0b2029)}html[data-theme="dark"] .hero-wave{background:var(--page)}html[data-theme="dark"] .exam-info,html[data-theme="dark"] .progress-card{background:rgba(16,42,53,.96)}html[data-theme="dark"] .field input,html[data-theme="dark"] .field textarea,html[data-theme="dark"] .field select,html[data-theme="dark"] .answer-text,html[data-theme="dark"] .answer{background:#0d2630;color:var(--ink);border-color:var(--line)}html[data-theme="dark"] .participant-check{background:#0d2630}html[data-theme="dark"] .btn.secondary{background:#0d2630;color:var(--ink)}html[data-theme="dark"] .answer:hover{background:#123541}html[data-theme="dark"] .answer.selected{background:linear-gradient(90deg,rgba(22,166,156,.2),rgba(45,180,125,.15))}html[data-theme="dark"] .progress{background:#23424e}
    .integrity-lock,.integrity-lock *{-webkit-user-select:none;user-select:none}.integrity-lock input,.integrity-lock textarea{-webkit-user-select:text;user-select:text}
    @media(max-width:700px){.hero{min-height:290px;padding:16px 15px 70px}.logo-shell{width:72px;height:52px}.ministry-copy{display:none}.hero-copy{margin-top:34px}.hero-copy h1{font-size:28px}.quiz-shell{margin-top:-52px}.exam-info{grid-template-columns:1fr 1fr;padding:12px}.info-item{padding:4px 8px}.info-item:nth-child(2){border-left:0}.info-item:last-of-type{grid-column:1/-1;border:0;border-top:1px solid var(--line);margin-top:8px;padding-top:12px}.panel{padding:21px 16px;border-radius:19px}.steps{margin-bottom:25px}.step{font-size:9px}.step i{width:30px;height:30px}.step-line{margin:0 6px}.actions .btn{padding:11px 13px}.answer{padding:11px}.content{margin-top:16px}.progress-wrap{align-items:flex-start;flex-direction:column;gap:4px}}
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-top"><div class="ministry-brand"><span class="logo-shell"><img src="/images/ministry-of-education.png" alt="شعار وزارة التعليم"></span><span class="ministry-copy"><b>منصة الاختبارات التعليمية</b><small>تجربة آمنة ومنظمة للمشارك</small></span></div><button class="theme-btn" id="quizThemeToggle" type="button" aria-label="تبديل المظهر"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg></button></div>
    <div class="hero-copy"><span class="hero-badge"><span aria-hidden="true">◆</span> اختبار إلكتروني معتمد</span><h1 id="heroQuizTitle">جارٍ تحميل الاختبار…</h1><p id="heroQuizDescription">تهيئة مساحة الاختبار الآمنة</p></div><span class="hero-wave" aria-hidden="true"></span>
  </header>
  <main class="quiz-shell">
    <section class="exam-info" id="examInfo">
      <div class="info-item"><span class="info-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 2v4m8-4v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2Z"/></svg></span><span><small>حالة الاختبار</small><b id="quizAvailability">متاح الآن</b></span></div>
      <div class="info-item"><span class="info-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><span><small>مدة الاختبار</small><b id="quizDuration">— دقيقة</b></span></div>
      <div class="info-item"><span class="info-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 20 7v5c0 4.4-3 7.4-8 9-5-1.6-8-4.6-8-9V7l8-4Z"/><path d="m9 12 2 2 4-4"/></svg></span><span><small>الجلسة</small><b id="sessionLabel">محمية وموثقة</b></span></div>
      <div class="timer hidden" id="timerbox"><span>الوقت المتبقي</span><b id="timer">00:00</b></div>
    </section>
    <section id="content" class="content"><div class="panel">جارٍ تحميل الاختبار…</div></section>
    <footer class="foot">بإشراف <b>وزارة التعليم</b> · جلسة اختبار خاصة ومحمية</footer>
  </main>
  <script src="/private-quiz.js" defer></script>
</body></html>
