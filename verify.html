<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <title>التحقق من المستند</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 0,#e0e7ff 0,transparent 34%),linear-gradient(180deg,#f8faff,#f4f7fb);font-family:Tahoma,Arial;color:#172033}
    .card{width:min(620px,100%);background:#fff;border:1px solid #dbe3ef;border-radius:24px;padding:34px;box-shadow:0 24px 70px #3341551a}
    .mark{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:#ecfdf5;border:1px solid #a7f3d0;color:#059669;font-size:34px}
    .eyebrow{color:#4f46e5;font-weight:700}
    h1{font-size:28px}
    .row{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid #e7edf5}
    .row span{color:#64748b}
    .error{color:#be123c}
    .foot{margin-top:20px;color:#64748b;font-size:13px;line-height:1.8}
    @media(max-width:520px){.card{padding:25px 21px;border-radius:18px}.row{align-items:flex-start;flex-direction:column;gap:5px}h1{font-size:24px}}
  </style>
</head>
<body><main class="card" id="content"><div class="eyebrow">بوابة التحقق الرسمية</div><h1>جارٍ التحقق من المستند…</h1></main><script src="/verify.js" defer></script></body>
</html>
