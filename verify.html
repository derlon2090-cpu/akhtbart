<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التحقق من المستند</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#1e3a8a,#08101f 55%);font-family:Tahoma,Arial;color:#f8fafc}.card{width:min(620px,100%);background:#0f172ae8;border:1px solid #93c5fd45;border-radius:24px;padding:34px;box-shadow:0 24px 70px #0008}.mark{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:#16a34a26;border:1px solid #4ade8080;color:#86efac;font-size:34px}.eyebrow{color:#93c5fd;font-weight:700}h1{font-size:28px}.row{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid #ffffff16}.row span{color:#94a3b8}.error{color:#fda4af}.foot{margin-top:20px;color:#94a3b8;font-size:13px;line-height:1.8}</style></head><body><main class="card" id="content"><div class="eyebrow">بوابة التحقق الرسمية</div><h1>جارٍ التحقق من المستند…</h1></main><script src="/verify.js" defer></script></body></html>
